<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<title>WiFi Scanner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 16px sans-serif; background: #f0f4f8; color: #222; }
header { background: #0066cc; color: white; padding: 20px; text-align: center; }
main { max-width: 600px; margin: 20px auto; padding: 20px; }
.card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 8px #0002; }
h2 { color: #0066cc; margin-bottom: 15px; }
.signal { font-size: 2rem; font-weight: bold; text-align: center; margin: 20px 0; }
.bars { display: flex; gap: 8px; justify-content: center; align-items: flex-end; height: 80px; }
.bar { width: 20px; background: #ccc; border-radius: 4px; transition: 0.3s; }
.bar.active { background: #0066cc; }
.bar.good { background: #4caf50; }
.bar.ok { background: #ff9800; }
.bar.bad { background: #f44336; }
.info { text-align: center; font-size: 1.1rem; margin: 10px 0; }
button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; background: #0066cc; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
button:active { opacity: 0.8; }
#status { font-size: 0.9rem; color: #666; margin-top: 10px; }
</style>
</head>
<body>
<header><h1>📶 WiFi Scanner</h1></header>
<main>
<div class="card">
<h2>Signal Strength</h2>
<div class="bars" id="bars"></div>
<div class="info" id="dbm">-50 dBm</div>
<div class="info" id="quality">Excellent</div>
<div class="info" id="dist">~5m</div>
<button onclick="scan()">Scan Now</button>
<p id="status"></p>
</div>

<div class="card">
<h2>Connection Info</h2>
<p id="info">Checking...</p>
</div>
</main>

<script>
const bars = [0,1,2,3,4];
let rssi = -50;

function updateBars(value) {
  rssi = value;
  const strength = Math.max(0, Math.min(100, (value + 100) * 2));
  const barCount = Math.ceil(strength / 20);
  
  document.getElementById('dbm').textContent = rssi + ' dBm';
  document.getElementById('quality').textContent = strength >= 80 ? 'Excellent' : strength >= 60 ? 'Good' : strength >= 40 ? 'Fair' : 'Poor';
  document.getElementById('dist').textContent = '~' + Math.max(1, Math.round(10 / (strength/20))) + 'm';
  
  let html = '';
  bars.forEach(i => {
    let cls = 'bar';
    if (i < barCount) {
      if (strength >= 80) cls += ' good';
      else if (strength >= 60) cls += ' ok';
      else cls += ' bad';
    }
    html += '<div class="' + cls + '"></div>';
  });
  document.getElementById('bars').innerHTML = html;
}

async function scan() {
  document.getElementById('status').textContent = 'Scanning...';
  
  try {
    const testUrl = 'https://www.google.com/generate_204';
    let sum = 0, count = 5;
    
    for (let i = 0; i < count; i++) {
      const start = Date.now();
      await fetch(testUrl, { cache: 'no-store' });
      const latency = Date.now() - start;
      const est = -50 + (200 - Math.min(latency, 200)) / 2;
      updateBars(est);
      await new Promise(r => setTimeout(r, 300));
    }
    
    document.getElementById('status').textContent = '✓ Scan complete';
  } catch {
    document.getElementById('status').textContent = '✗ Check connection';
  }
}

function getInfo() {
  let info = 'Loading...';
  if (navigator.connection) {
    const conn = navigator.connection.effectiveType;
    info = 'Type: ' + conn + ' | Unsaved: ' + navigator.connection.saveData;
  }
  document.getElementById('info').textContent = info;
}

updateBars(-60);
getInfo();
setInterval(scan, 10000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
