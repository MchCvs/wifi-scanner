cd ~/Documents/Wifi-scanner && rm index.html && cat > index.html << 'ENDOFFILE'
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0066cc">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/wifi-scanner/manifest.json">
  <link rel="icon" href="/wifi-scanner/icon.svg">
  <title>Analyseur WiFi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 16px sans-serif; background: #f0f4f8; color: #222; }
    header { background: #0066cc; color: white; padding: 20px; text-align: center; }
    .card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #0066cc; margin-bottom: 15px; }
    .signal-value { font-size: 3rem; font-weight: bold; color: #0066cc; text-align: center; margin: 20px 0; }
    .bars { display: flex; gap: 8px; justify-content: center; align-items: flex-end; height: 80px; }
    .bar { width: 20px; background: #e0e0e0; border-radius: 4px; }
    .bar.fill-1 { height: 20%; background: #f44336; }
    .bar.fill-2 { height: 40%; background: #ff9800; }
    .bar.fill-3 { height: 60%; background: #ffc107; }
    .bar.fill-4 { height: 80%; background: #4caf50; }
    .bar.fill-5 { height: 100%; background: #4caf50; }
    .info { text-align: center; font-size: 1.1rem; margin: 10px 0; }
    button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; background: #0066cc; color: white; font-size: 16px; cursor: pointer; }
    #status { font-size: 0.9rem; color: #666; margin-top: 10px; text-align: center; }
    .success { color: #28a745; }
    .error { color: #dc3545; }
    .network-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .network-item { background: #f8f9fa; padding: 8px; border-radius: 5px; text-align: center; }
    .calibration { margin-top: 15px; padding: 15px; background: #fff3cd; border-radius: 8px; }
    .history { margin-top: 20px; }
    .history-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header><h1>📶 Analyseur WiFi</h1></header>
  <main>
    <div class="card">
      <div class="signal-value" id="signalValue">-60</div>
      <span>dBm</span>
      <div class="info" id="signalQuality">Bonne</div>
      <div class="bars" id="bars"></div>
      <div class="info">Distance: <span id="distance">~8m</span></div>
      <div class="info">Qualité: <span id="qualityPercent">75%</span></div>
      <div class="info">Vitesse: <span id="speed">-- Mbps</span></div>
      <button onclick="scan()">Analyser maintenant</button>
      <button onclick="calibrate()" class="secondary">Calibrer</button>
      <p id="status"></p>
    </div>
    <div class="card">
      <h2>📊 Informations réseau</h2>
      <div id="networkInfo" class="network-info"></div>
    </div>
    <div class="card calibration" id="calibrationSection" style="display:none;">
      <h3>⚙️ Calibration</h3>
      <p>Distance par rapport au routeur (m):</p>
      <input type="number" id="calibrationDistance" placeholder="5" min="1" max="100">
      <button onclick="saveCalibration()">Enregistrer</button>
      <button onclick="hideCalibration()">Annuler</button>
    </div>
    <div class="card history">
      <h3>📈 Historique</h3>
      <div id="historyList"></div>
      <button onclick="clearHistory()">Effacer</button>
    </div>
  </main>
  <script>
    let calibrationDistance = null;
    let history = [];

    function updateBars(strength) {
      const container = document.getElementById('bars');
      let html = '';
      for (let i = 1; i <= 5; i++) {
        let cls = 'bar';
        if (i <= strength/20) {
          cls += strength >= 80 ? ' fill-5' : strength >= 60 ? ' fill-4' : strength >= 40 ? ' fill-3' : strength >= 20 ? ' fill-2' : ' fill-1';
        }
        html += '<div class="' + cls + '"></div>';
      }
      container.innerHTML = html;
    }

    async function scan() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Analyse en cours...';

      try {
        // Test de latence vers un endpoint très léger
        const start = Date.now();
        await fetch('https://www.google.com/favicon.ico', { cache: 'no-store' });
        const latency = Date.now() - start;

        // NOUVELLE FORMULE CORRIGÉE
        // Plus la latence est faible, meilleur est le signal
        // Latence typique: 10-50ms (excellent) à 200ms+ (mauvais)
        let rssi = -40 - (latency / 4); // Formule corrigée
        rssi = Math.max(-100, Math.min(-20, Math.round(rssi)));

        const strength = Math.max(0, Math.min(100, (rssi + 100) * 1.25));

        document.getElementById('signalValue').textContent = rssi;
        document.getElementById('signalQuality').textContent = strength >= 80 ? 'Excellente' : strength >= 60 ? 'Bonne' : strength >= 40 ? 'Moyenne' : strength >= 20 ? 'Faible' : 'Très faible';
        document.getElementById('qualityPercent').textContent = Math.round(strength) + '%';

        if (calibrationDistance) {
          document.getElementById('distance').textContent = '~' + calibrationDistance + 'm';
        } else {
          // Estimation de distance basée sur le RSSI
          document.getElementById('distance').textContent = '~' + Math.round(Math.pow(10, (rssi + 40) / 20)) + 'm';
        }

        document.getElementById('speed').textContent = '-- Mbps';
        updateBars(strength);

        // Infos réseau
        const networkInfo = document.getElementById('networkInfo');
        networkInfo.innerHTML = `
          <div class="network-item">Latence: ${latency}ms</div>
          <div class="network-item">RSSI: ${rssi} dBm</div>
          <div class="network-item">Qualité: ${strength}%</div>
          ${calibrationDistance ? `<div class="network-item">Calibré: ${calibrationDistance}m</div>` : ''}
        `;

        // Historique
        history.push({ time: Date.now(), rssi, quality: strength >= 80 ? 'Excellente' : strength >= 60 ? 'Bonne' : strength >= 40 ? 'Moyenne' : strength >= 20 ? 'Faible' : 'Très faible' });
        if (history.length > 20) history.shift();
        localStorage.setItem('wifiHistory', JSON.stringify(history));

        updateHistory();
        statusEl.textContent = '✓ Analyse terminée';
        statusEl.className = 'success';
      } catch(e) {
        statusEl.textContent = '✗ Erreur: ' + e.message;
        statusEl.className = 'error';
      }
    }

    function calibrate() {
      document.getElementById('calibrationSection').style.display = 'block';
    }

    function hideCalibration() {
      document.getElementById('calibrationSection').style.display = 'none';
    }

    function saveCalibration() {
      calibrationDistance = parseFloat(document.getElementById('calibrationDistance').value);
      if (isNaN(calibrationDistance) || calibrationDistance <= 0) {
        alert('Distance invalide');
        return;
      }
      localStorage.setItem('calibrationDistance', calibrationDistance);
      hideCalibration();
      scan();
    }

    function updateHistory() {
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<p>Aucune mesure</p>';
        return;
      }
      let html = '';
      history.slice().reverse().forEach(item => {
        html += `<div class="history-item"><span>${new Date(item.time).toLocaleTimeString()}</span><span>${item.rssi} dBm (${item.quality})</span></div>`;
      });
      container.innerHTML = html;
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('wifiHistory');
      updateHistory();
    }

    // Charger l'historique et la calibration
    if (localStorage.getItem('wifiHistory')) {
      history = JSON.parse(localStorage.getItem('wifiHistory'));
      updateHistory();
    }
    if (localStorage.getItem('calibrationDistance')) {
      calibrationDistance = parseFloat(localStorage.getItem('calibrationDistance'));
    }

    // Initialisation
    updateBars(60);
    document.getElementById('signalValue').textContent = '-60';
    document.getElementById('signalQuality').textContent = 'Bonne';
    document.getElementById('qualityPercent').textContent = '75%';
    document.getElementById('distance').textContent = '~8m';
  </script>
</body>
</html>
ENDOFFILE
